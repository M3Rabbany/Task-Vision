services:
  backend:
    build: .
    image: taskvision-app:latest
    # Port aplikasi hanya bisa dijangkau dari dalam jaringan Docker.
    # Semua akses publik wajib melewati Caddy lewat HTTPS di port 443.
    expose:
      - "8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_NAME=mydb
      - DB_URL=jdbc:mysql://db:3306/mydb
      - DDL_AUTO=update
      - HIBERNATE_SHOW_SQL=false
      - JPA_SHOW_SQL=false
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://localhost}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
    networks:
      - task-vision-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-}
      - LOCAL_HOSTS=${LOCAL_HOSTS:-localhost}
    volumes:
      # Default: Caddyfile.local (sertifikat internal). Untuk domain publik,
      # set CADDYFILE=Caddyfile.prod di .env.
      - ./deploy/caddy/${CADDYFILE:-Caddyfile.local}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - task-vision-network
    depends_on:
      - backend
  db:
    image: mysql:8.0
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - MYSQL_DATABASE=mydb
    networks:
      - task-vision-network
    expose:
      - "3306"
      - "33060"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  db-data:
  caddy_data:
  caddy_config:
networks:
  task-vision-network:
    driver: bridge
