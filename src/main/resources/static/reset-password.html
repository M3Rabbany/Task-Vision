<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buat password baru untuk akun Task Vision Anda.">
  <title>Reset password · Task Vision</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    try {
      const savedTheme = localStorage.getItem("taskvision.theme");
      if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (_) { /* ignore */ }
  </script>
</head>
<body class="auth-body">
  <main class="reset-shell">
    <section class="reset-card">
      <a class="auth-brand" href="/login" style="color:var(--ink);margin-bottom:26px">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
        </span>
        <span>Task Vision<small style="color:var(--muted)">Project Management Hub</small></span>
      </a>

      <span class="reset-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
      </span>

      <h1>Buat password baru</h1>
      <p>Masukkan password baru untuk akun Anda. Pastikan password mudah Anda ingat tetapi tetap aman.</p>

      <div id="reset-alert" class="auth-alert" role="alert" style="margin-top:18px"></div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="field">
          <label for="reset-token">Token reset</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="reset-token" name="token" type="text" placeholder="Tempel token dari email" autocomplete="off" required>
          </div>
          <span class="hint">Token otomatis terisi jika Anda membuka tautan dari email.</span>
        </div>

        <div class="field">
          <label for="reset-password">Password baru</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="reset-password" name="password" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password" required>
          </div>
        </div>

        <div class="field">
          <label for="reset-confirm">Konfirmasi password baru</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="reset-confirm" name="confirm" type="password" placeholder="Ulangi password baru" autocomplete="new-password" required>
          </div>
        </div>

        <button class="btn btn-primary btn-lg btn-block auth-submit" type="submit" id="reset-submit">
          Simpan password baru
        </button>

        <a class="btn btn-ghost btn-block" href="/login">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          Kembali ke halaman masuk
        </a>
      </form>
    </section>
  </main>

  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
